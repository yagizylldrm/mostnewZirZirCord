# LiveKit SFU – development config
port: 7880
log_level: info
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
keys:
  devkey: devsecret-change-me-0123456789abcdef
room:
  auto_create: true
  empty_timeout: 30
  # Opus RED (redundant audio) for loss resilience is negotiated by clients.
  enabled_codecs:
    - mime: audio/opus
    - mime: audio/red
    - mime: video/vp9
    - mime: video/av1
    - mime: video/vp8
    - mime: video/h264
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:4000/webhooks/livekit
