# Production stack for a single VPS.
#   cp infra/.env.prod.example infra/.env.prod   (fill it in)
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d --build
name: zirzircord
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      LIVEKIT_DOMAIN: ${LIVEKIT_DOMAIN}
      FILES_DOMAIN: ${FILES_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web, server, livekit, storage]

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
      args:
        VITE_API_URL: https://${API_DOMAIN}
    restart: unless-stopped
    volumes:
      - ./web.Caddyfile:/etc/caddy/Caddyfile:ro

  server:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 4000
      PUBLIC_API_URL: https://${API_DOMAIN}
      CORS_ORIGINS: https://${APP_DOMAIN}
      DATABASE_URL: postgresql://zirzir:${POSTGRES_PASSWORD}@postgres:5432/zirzircord
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      PRESENCE_GRACE_SECONDS: 30
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      S3_ENDPOINT: http://storage:9000
      S3_PUBLIC_ENDPOINT: https://${FILES_DOMAIN}
      S3_REGION: us-east-1
      S3_BUCKET: zirzircord
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_FORCE_PATH_STYLE: "true"
      LIVEKIT_URL: wss://${LIVEKIT_DOMAIN}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on: [postgres, redis, storage]

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zirzir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: zirzircord
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes: [redisdata:/data]

  storage:
    image: chrislusf/seaweedfs:latest
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - storagedata:/data
      - ./seaweed-s3.prod.json:/etc/seaweedfs/s3.json:ro

  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"              # WebRTC over TCP
      - "3478:3478/udp"          # TURN
      - "50000-50200:50000-50200/udp"  # WebRTC media

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  redisdata:
  storagedata:
