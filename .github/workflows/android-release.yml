name: Android release

# Push a tag like `mobile-v0.1.0` to build a signed APK and attach it to a draft GitHub Release.
# Run it by hand (Actions tab) to get the APK as a downloadable artifact without a release.
#
# One-time setup (repository secrets): the release key is made once and must be kept safe:
# an app can only be updated by an APK signed with the same key.
#   ANDROID_KEYSTORE_BASE64   the .jks file, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
# Variable: VITE_API_URL (the production API, also used by the desktop build).
on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_PUBLIC_API_URL: ${{ vars.VITE_API_URL }}
      ANDROID_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Release key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Never ship an APK signed with the debug key: stop here if the key is missing.
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set (see the comment at the top of this workflow)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build the release APK
        working-directory: apps/mobile/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        # Phones are arm64 (older ones armv7); skipping the x86 emulator builds halves the APK.
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon

      - name: Name and verify the APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          APK="ZirZirCord-${VERSION}-${ANDROID_VERSION_CODE}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$APK"
          "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" | head -3
          echo "name=$APK" >> "$GITHUB_OUTPUT"
          echo "path=apps/mobile/$APK" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}

      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/mobile-v')
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" --draft \
            --title "ZirZirCord Android $GITHUB_REF_NAME" \
            --notes "Signed APK. On the phone: allow installing from this source, open the file, and install. Updates must come from builds signed with the same key. Voice calls and screen sharing on Android have only been tried on an emulator so far."
